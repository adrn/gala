name: Benchmarks
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
      - devel

jobs:
  check_should_run:
    name: Check if benchmarks should run
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: Check conditions
        id: check
        run: |
          # Always run on push to main
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"

          # For pull requests, only run if the PR has the "benchmark" label
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            if [ "${{ contains(github.event.pull_request.labels.*.name, 'benchmark') }}" == "true" ]; then
              echo "should-run=true" >> "$GITHUB_OUTPUT"
            else
              echo "should-run=false" >> "$GITHUB_OUTPUT"
              echo "Skipping because PR does not have 'benchmark' label"
            fi
          else
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          fi

  benchmarks:
    name: "Run the benchmarks"
    runs-on: ubuntu-latest
    needs: check_should_run
    permissions:
      contents: write # push scaling results to the benchmark-results branch
    concurrency:
      # serialize pushes so commits to benchmark-results don't race
      group: benchmarks-${{ github.event_name == 'push' && 'push' || github.ref }}
      cancel-in-progress: false
    if:
      ${{ needs.check_should_run.outputs.should-run == 'true' &&
      github.event.pull_request.draft == false }}
    env:
      # Run tests against a tagged EXP version, unless this is the devel branch or a PR into devel, in which case test against EXP devel
      EXP_REF: ${{ (github.ref == 'refs/heads/devel' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'devel')) && 'devel' || 'v7.10.0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Linux GSL
        run: |
          sudo apt-get update
          sudo apt-get install gsl-bin libgsl0-dev build-essential

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.0"

      - name: Install GSL
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install gsl-bin libgsl0-dev build-essential

      - name: Clone EXP
        uses: actions/checkout@v7
        with:
          repository: EXP-code/EXP
          submodules: recursive
          ref: ${{ env.EXP_REF }}
          path: EXP
          # TODO: this always clones main, which is the latest release. Do we want to
          # also add a benchmark against devel?

      - name: Install EXP dependencies
        run: |
          sudo apt-get install -y libeigen3-dev libfftw3-dev libopenmpi-dev libomp-dev libhdf5-dev

      - name: Build EXP
        uses: ./.github/actions/build-exp
        with:
          build-type: Release

      - name: Install package and dependencies
        run: |
          uv sync --locked --python 3.12 --no-default-groups --group test

      - name: Run the benchmarks
        if: github.ref_type != 'tag'
        uses: CodSpeedHQ/action@v5.5.0
        env:
          OMP_NUM_THREADS: 1
        with:
          mode: simulation
          run: uv run --no-sync pytest tests/benchmarks -n auto --codspeed --durations=0 -v
          token: ${{ secrets.CODSPEED_TOKEN }}

      # Scaling benchmarks: same test files, timed by pytest-benchmark (wall-clock) so
      # we can plot time vs. parameter values. Rendered in docs/benchmarks.rst.
      # Only fixture-based benchmark files are listed: pytest-benchmark does not time
      # tests that use the @pytest.mark.benchmark marker.
      - name: Run the scaling benchmarks
        env:
          OMP_NUM_THREADS: 1
        run: >
          uv run --no-sync pytest tests/benchmarks/test_actionangle_benchmark.py
          -p no:xdist --benchmark-min-rounds=1 --benchmark-json=results.json

      - name: Plot the scaling benchmarks
        if: github.event_name == 'pull_request'
        env:
          GALA_BENCH_JSON: results.json
          GALA_BENCH_OUT: scaling-plots
        run: uv run --no-sync python docs/benchmarks/plot_scaling.py

      - name: Upload the scaling benchmarks
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: scaling-benchmarks
          path: |
            results.json
            scaling-plots/

      - name: Check out the benchmark-results branch
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          ref: benchmark-results
          path: bench-data

      - name: Commit the scaling benchmarks
        if: github.event_name == 'push'
        working-directory: bench-data
        run: |
          cp ../results.json "results-${{ github.ref_type == 'tag' && github.ref_name || 'main' }}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Scaling benchmarks for ${{ github.ref_name }} (${{ github.sha }})" || exit 0
          git pull --rebase
          git push
